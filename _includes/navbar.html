<a class="skip-link" href="#main-content">Skip to content</a>
<header class="site-header">
  <nav class="site-nav" aria-label="Main">
    <a class="site-logo" href="{{ '/' | relative_url }}">
      <img src="{{ '/img/gtm-logo.svg' | relative_url }}" alt="GreaterThan Media" width="48" height="32">
    </a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-menu">Menu</button>
    <ul class="nav-links" id="nav-menu">
      {% for item in site.nav %}
        {% unless item.title == 'Contact' %}
        {% assign nav_path = item.url | remove: 'index.html' %}
        <li>
          <a href="{{ item.url | relative_url }}"{% if page.url == nav_path or page.permalink == nav_path %} class="active"{% endif %}>{{ item.title }}</a>
        </li>
        {% endunless %}
      {% endfor %}
      <li class="nav-cta">
        <a href="{{ '/contact/' | relative_url }}">Contact</a>
      </li>
    </ul>
  </nav>
</header>
