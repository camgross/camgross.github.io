<script>
(function () {
  var toggle = document.querySelector('.nav-toggle');
  var menu = document.getElementById('nav-menu');
  if (toggle && menu) {
    toggle.addEventListener('click', function () {
      var open = menu.classList.toggle('open');
      toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    });
  }

  var form = document.getElementById('contactForm');
  if (!form) return;

  var contactEmail = form.dataset.contactEmail || {{ site.email | jsonify }};
  var turnstileSiteKey = form.dataset.turnstileSiteKey || '';
  var honeypot = form.querySelector('input[name="_gotcha"]');
  var turnstileContainer = document.getElementById('turnstileContainer');
  var turnstileReady = !turnstileSiteKey;

  function loadTurnstile() {
    if (!turnstileSiteKey || !turnstileContainer) return;

    var script = document.createElement('script');
    script.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
    script.async = true;
    script.defer = true;
    script.onload = function () {
      if (!window.turnstile) return;
      window.turnstile.render(turnstileContainer, {
        sitekey: turnstileSiteKey,
        callback: function () {
          turnstileReady = true;
        },
        'expired-callback': function () {
          turnstileReady = false;
        },
        'error-callback': function () {
          turnstileReady = false;
        }
      });
    };
    document.head.appendChild(script);
  }

  loadTurnstile();

  form.addEventListener('submit', function (e) {
    e.preventDefault();

    if (honeypot && honeypot.value) {
      return;
    }

    if (turnstileSiteKey && !turnstileReady) {
      var status = document.getElementById('formStatus');
      status.textContent = 'Please complete the verification check.';
      status.className = 'form-status error';
      return;
    }

    var status = document.getElementById('formStatus');
    var btn = form.querySelector('button[type="submit"]');
    btn.disabled = true;
    status.textContent = '';
    status.className = 'form-status';

    var data = new FormData(form);
    fetch(form.action, {
      method: 'POST',
      body: data,
      headers: { Accept: 'application/json' }
    })
      .then(function (res) {
        if (res.ok) {
          status.textContent = 'Thanks — your message was sent.';
          status.className = 'form-status success';
          form.reset();
          if (window.turnstile && turnstileContainer) {
            window.turnstile.reset(turnstileContainer);
          }
        } else {
          throw new Error('Send failed');
        }
      })
      .catch(function () {
        status.textContent = 'Something went wrong. Email ' + contactEmail + ' directly.';
        status.className = 'form-status error';
      })
      .finally(function () {
        btn.disabled = false;
      });
  });
})();
</script>
